name: QA Isolation Guards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  isolation-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run structural + behavioral isolation guards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QA_GUARD_SECRET: ${{ secrets.QA_GUARD_SECRET }}
        run: node scripts/qa-guards.mjs
