name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Vitest frontend suite (always runs, no secrets needed) ──
  vitest:
    name: Vitest (frontend tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bun run test

  # ── Job 2: Edge function pen-tests against QA Supabase project ──
  # Skipped automatically when QA_SUPABASE_URL secret is missing
  # (e.g. forks, first-time setup).
  pentest:
    name: Edge function pen-tests
    runs-on: ubuntu-latest
    needs: vitest
    if: ${{ vars.QA_TESTS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Call qa-invite-tests
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QA_SUPABASE_URL:-}" ] || [ -z "${QA_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::QA secrets not configured — skipping pen-tests"
            exit 0
          fi
          echo "Calling qa-invite-tests at $QA_SUPABASE_URL"
          RESPONSE=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "apikey: $QA_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $QA_SUPABASE_ANON_KEY" \
            "$QA_SUPABASE_URL/functions/v1/qa-invite-tests" || echo '{"allPass":false,"error":"call failed"}')
          echo "$RESPONSE" | jq .
          ALL_PASS=$(echo "$RESPONSE" | jq -r '.allPass')
          if [ "$ALL_PASS" != "true" ]; then
            echo "::error::Pen-tests failed"
            exit 1
          fi

      - name: Call qa-pentest (RLS isolation)
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QA_SUPABASE_URL:-}" ] || [ -z "${QA_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::QA secrets not configured — skipping RLS pen-test"
            exit 0
          fi
          # Optional: only runs if qa-pentest is deployed to the QA project.
          RESPONSE=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "apikey: $QA_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $QA_SUPABASE_ANON_KEY" \
            "$QA_SUPABASE_URL/functions/v1/qa-pentest" 2>/dev/null || echo '{"allPass":"skip"}')
          echo "$RESPONSE" | jq .
          ALL_PASS=$(echo "$RESPONSE" | jq -r '.allPass')
          if [ "$ALL_PASS" = "false" ]; then
            echo "::error::RLS pen-tests failed"
            exit 1
          fi
